name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            runtime: CPython
          - python-version: "3.13"
            runtime: CPython
          - python-version: "3.14"
            runtime: CPython
          - python-version: "pypy3.11"
            runtime: PyPy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and runtime dependencies
        run: python -m pip install --upgrade pip pydantic "pytest>=8,<10" build
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest test -q
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
